<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 128 128">
  <!-- TGC Game Menu: the store icon, drawn at 128 and shown at 256 px; the project icon
       (icon.svg) is the same picture. A menu panel; its first button has the focus, the two others are
       settings rows (a toggle and a slider label). Hand-drawn, no image. -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="#0f1420"/>
  <rect x="22" y="20" width="84" height="88" rx="12" fill="#10141f" stroke="#5c73ad" stroke-width="3"/>
  <!-- The focused button -->
  <rect x="34" y="33" width="60" height="14" rx="7" fill="#4f679e" stroke="#9eb8ff" stroke-width="2.4"/>
  <rect x="46" y="38.5" width="34" height="3.2" rx="1.6" fill="#ffffff"/>
  <!-- Two settings rows -->
  <rect x="34" y="55" width="60" height="14" rx="7" fill="#3b4a6b"/>
  <circle cx="43" cy="62" r="2.8" fill="#dbe6ff"/>
  <rect x="50" y="60.4" width="36" height="3.2" rx="1.6" fill="#dbe6ff"/>
  <rect x="34" y="77" width="60" height="14" rx="7" fill="#3b4a6b"/>
  <circle cx="43" cy="84" r="2.8" fill="#dbe6ff"/>
  <rect x="50" y="82.4" width="25" height="3.2" rx="1.6" fill="#dbe6ff"/>
</svg>
