[plugin]

name="TGC Game Menu"
description="A main menu and pause menu for Godot 4, configured from one resource: language, display (window mode and size, vsync, frame rate, 3D render scale, MSAA, interface size), volumes per bus, and keyboard, mouse and gamepad controls remapped on screen. Optional saving and loading — slots, quick saves with remappable shortcuts — done by your own code. Settings are saved and read back without trusting the file. English, French, German and Spanish."
author="TheGameCraftsman"
version="1.1.0"
script="plugin.gd"
